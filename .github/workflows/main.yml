name: Rspec
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: 
      image: ruby:3.2-slim
    name: Rspec Test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install apt
        run: |
          apt-get update
          apt-get install -y git wget xz-utils build-essential libyaml-dev
      - uses: browser-actions/setup-firefox@v1
      - run: firefox --version
      - name: Install dependencies
        run: |
          apt-get install -y fonts-noto
          wget "https://github.com/mozilla/geckodriver/releases/download/v0.36.0/geckodriver-v0.36.0-linux64.tar.gz" -O geckodriver.tar.gz
          tar -xzf geckodriver.tar.gz -C /usr/local/bin
          bundle install
      - name: Execute Rspec
        run: bundle exec rspec
